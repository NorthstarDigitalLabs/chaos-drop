name: Android prototype

on:
  push:
    branches: [main, "prototype/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"
          cache-provider: basic
      - name: Check game JavaScript syntax
        run: node --check app/src/main/assets/game.js
      - name: Smoke test touch controls and retry flow
        run: node tests/game-smoke.cjs
      - name: Verify winning routes for all five puzzles at 30 and 60 FPS
        run: node tests/level-solvability.cjs
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify launcher activity is packaged
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          apk = "app/build/outputs/apk/debug/app-debug.apk"
          expected = b"Lcom/northstardigitallabs/chaosdrop/MainActivity;"
          with ZipFile(apk) as archive:
              dex_files = [name for name in archive.namelist() if name.endswith(".dex")]
              assert dex_files, "APK contains no DEX bytecode"
              assert any(expected in archive.read(name) for name in dex_files), (
                  "Launcher activity is missing from APK DEX bytecode"
              )
          print("Launcher activity is present in APK DEX bytecode.")
          PY
      - name: Save installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chaos-drop-debug-apk-v0.1.2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
